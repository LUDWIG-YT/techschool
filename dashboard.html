<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Admin</title>

<!-- =============================
🎨 ESTILOS GENERALES
============================= -->
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- =============================
🌌 FONDO MATRIX (EFECTO VISUAL)
============================= -->
<canvas id="matrix"></canvas>

<!-- =============================
🔐 PROTECCIÓN DE ACCESO
============================= -->
<script>
// Si no hay sesión activa, regresa al inicio
if(localStorage.getItem("login") !== "true"){
    window.location.href="index.html";
}
</script>

<!-- =============================
🧠 TÍTULO PRINCIPAL
============================= -->
<h1 style="text-align:center;">Panel de Administración</h1>


<!-- =============================
💻 CONSOLA HACKER
============================= -->
<div class="console" id="console">
    <p>> sistema iniciando...</p>
</div>


<!-- =============================
⌨️ INPUT DE COMANDOS
============================= -->
<div style="text-align:center; margin-top:10px;">
    <input id="cmd" placeholder="Escribe un comando..." style="width:60%;">
    <button onclick="ejecutar()">Ejecutar</button>
</div>


<!-- =============================
📦 FORMULARIO DE PRODUCTOS
============================= -->
<div style="text-align:center; margin-top:30px;">

    <!-- Nombre del producto -->
    <input id="n" placeholder="Nombre del producto"><br><br>

    <!-- Precio -->
    <input id="pr" placeholder="Precio"><br><br>

    <!-- Ruta de imagen -->
    <input id="img" placeholder="Ruta imagen (img/fundaX.jpg)"><br><br>

    <!-- Botones -->
    <button onclick="add()">Agregar producto</button>
    <button onclick="logout()">Cerrar sesión</button>

</div>


<!-- =============================
📌 FOOTER (ACCESO OCULTO)
============================= -->
<footer class="ludwig">
LUDWIG // NIGHTSHARK CLUB
</footer>


<!-- =============================
⚙️ SCRIPT PRINCIPAL
============================= -->
<script src="js/dashboard.js"></script>

</body>
</html>
